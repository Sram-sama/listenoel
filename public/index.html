<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎄 Listes de Noël 🎄</title>
<style>
  body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
  h1 { text-align: center; color: #c0392b; }
  h2 { color: #2980b9; }
  h3 { margin-bottom: 5px; }

  #login, #main { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

  select, input:not([type="checkbox"]):not([type="button"]):not([type="submit"]), textarea, button {
    padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc;
  }

  textarea { resize: vertical; }

  button { background: #2980b9; color: white; border: none; cursor: pointer; }
  button:hover { background: #3498db; }

  ul { list-style: none; padding-left: 0; margin: 0; }
  /* chaque item : checkbox + contenu ; contenu à gauche, bouton édit à droite */
  li {
    padding: 8px 0;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    justify-content: space-between;
  }

  /* zone contenant nom + description, alignée à gauche et prenant le max d'espace */
  .item-content {
    flex: 1 1 auto;
    text-align: left;
    display: block;
  }

  .item-name { display: block; font-weight: 700; margin-bottom: 4px; }
  .item-comment { display: block; margin-top: 0; color: #333; word-break: break-word; }

  /* petite marge autour de la checkbox */
  input[type="checkbox"] {
    margin: 6px 12px 0 0;
    width: auto;
    height: auto;
    cursor: pointer;
  }

  label { cursor: default; display: inline-flex; align-items: flex-start; gap: 8px; }

  #others div { margin-bottom: 15px; background: #f1f1f1; padding: 10px; border-radius: 5px; }

  /* Popups */
  #confirmPopup, #pinPopup, #editCommentPopup {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
  }

  #confirmPopup div, #pinPopup div, #editCommentPopup div {
    background: #fff; padding: 20px; border-radius: 10px; max-width: 400px; width: 90%; text-align: center;
  }

  #confirmPopup button, #pinPopup button, #editCommentPopup button { margin: 5px; width: 80px; }

  #keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  #keypad button { padding: 15px; font-size: 18px; border-radius: 5px; }

  #pinInput { text-align: center; font-size: 18px; letter-spacing: 5px; width: 100%; margin-bottom: 10px; }

  #changePinBtn { margin-top: 20px; background: #27ae60; }

  .editBtn { cursor: pointer; margin-left: 10px; color: #2980b9; font-weight: bold; flex: 0 0 auto; }

  a { color: #2980b9; text-decoration: none; }
  a:hover { text-decoration: underline; }

  footer { text-align: center; margin-top: 40px; font-size: 14px; color: #555; }
</style>
</head>
<body>

<h1>🎄 Listes de Noël 🎄</h1>

<div id="login">
  <h3>Choisir votre nom :</h3>
  <select id="userSelect">
    <option value="">-- Sélectionner --</option>
  </select>

  <h3>Entrez votre PIN :</h3>
  <input type="password" id="pinInput" placeholder="****" readonly/>

  <div id="keypad">
    <button class="num">1</button>
    <button class="num">2</button>
    <button class="num">3</button>
    <button class="num">4</button>
    <button class="num">5</button>
    <button class="num">6</button>
    <button class="num">7</button>
    <button class="num">8</button>
    <button class="num">9</button>
    <button id="clear">Effacer</button>
    <button class="num">0</button>
    <button id="enter">✔</button>
  </div>
</div>

<div id="main" style="display:none;">
  <h2>Mes cadeaux</h2>
  <ul id="myList"></ul>

  <h3>Ajouter un cadeau à ma liste :</h3>
  <input id="newItem" placeholder="Nom du cadeau">
  <textarea id="newComment" placeholder="Commentaire / lien (optionnel)"></textarea>
  <button id="addBtn">Ajouter</button>

  <h2>Autres listes</h2>
  <div id="others"></div>

  <button id="changePinBtn">Changer mon code PIN</button>
  <button id="logoutBtn" style="background:#7f8c8d;">Me déconnecter</button>
</div>

<!-- Popups -->
<div id="confirmPopup">
  <div>
    <p id="confirmMessage"></p>
    <button id="confirmYes">Oui</button>
    <button id="confirmNo">Non</button>
  </div>
</div>

<div id="pinPopup">
  <div>
    <h3>Changer votre code PIN</h3>
    <input type="password" id="newPin" placeholder="Nouveau code PIN (4 chiffres)" maxlength="4">
    <input type="password" id="confirmPin" placeholder="Confirmez le code PIN" maxlength="4">
    <button id="savePin">Valider</button>
    <button id="cancelPin">Annuler</button>
  </div>
</div>

<div id="editCommentPopup">
  <div>
    <h3>Modifier le commentaire</h3>
    <textarea id="editCommentText" rows="3"></textarea>
    <br>
    <button id="saveComment">Valider</button>
    <button id="cancelComment">Annuler</button>
  </div>
</div>

<footer>
  Pour contacter le support technique, contacter Marceau Vienne sur Whatsapp
</footer>

<script>
let currentUser = null;
let token = null;
let data = null;
let editingItem = null;

try { token = sessionStorage.getItem("token"); } catch (e) {}

/* Appel API avec jeton ; renvoie null (et ramène au login) si la session a expiré */
async function api(path, body) {
  const opts = { headers: { "Content-Type": "application/json" } };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) { opts.method = "POST"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (res.status === 401 && path !== "/login") { logout("Session expirée, reconnectez-vous."); return null; }
  let json = {};
  try { json = await res.json(); } catch (e) {}
  if (!res.ok) { alert(json.error || "Une erreur est survenue"); return null; }
  return json;
}

function logout(msg) {
  token = null; currentUser = null; data = null;
  try { sessionStorage.removeItem("token"); } catch (e) {}
  document.getElementById("main").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("pinInput").value = "";
  if (msg) alert(msg);
}

async function loadUsers() {
  const res = await fetch("/users");
  const { users } = await res.json();
  const select = document.getElementById("userSelect");
  select.innerHTML = "";
  const first = document.createElement("option");
  first.value = ""; first.textContent = "-- Sélectionner --";
  select.appendChild(first);
  users.forEach(name => {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    select.appendChild(o);
  });
}

async function loadData() {
  const d = await api("/data");
  if (!d) return false;
  data = d;
  currentUser = d.me;
  return true;
}

async function showMain() {
  if (!(await loadData())) return;
  document.getElementById("login").style.display = "none";
  document.getElementById("main").style.display = "block";
  renderLists();
}

document.querySelectorAll(".num").forEach(btn => {
  btn.onclick = () => {
    const input = document.getElementById("pinInput");
    if (input.value.length < 4) input.value += btn.textContent;
  };
});

document.getElementById("clear").onclick = () => { document.getElementById("pinInput").value = ""; };

document.getElementById("enter").onclick = async () => {
  const pin = document.getElementById("pinInput").value;
  const sel = document.getElementById("userSelect").value;
  if (!sel) { alert("Sélectionnez un utilisateur"); return; }
  const r = await api("/login", { user: sel, pin });
  document.getElementById("pinInput").value = "";
  if (!r) return;
  token = r.token;
  try { sessionStorage.setItem("token", token); } catch (e) {}
  await showMain();
};

/* Échappe le HTML puis rend les liens cliquables */
function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function makeLinksClickable(text) {
  if (!text) return "";
  return escapeHtml(text).replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
}

function itemContent(itemObj) {
  return `<span class="item-content">
      <span class="item-name">${escapeHtml(itemObj.name)}</span>
      <span class="item-comment">${itemObj.comment ? " " + makeLinksClickable(itemObj.comment) : ""}</span>
    </span>`;
}

function renderLists() {
  const myList = document.getElementById("myList");
  myList.innerHTML = "";
  const me = data.users.find(u => u.name === currentUser) || { list: [] };
  me.list.forEach(itemObj => {
    const li = document.createElement("li");
    li.innerHTML = itemContent(itemObj) + `<span class="editBtn">✏️</span>`;
    li.querySelector(".editBtn").onclick = () => editComment(itemObj.name);
    myList.appendChild(li);
  });

  const others = document.getElementById("others");
  others.innerHTML = "";
  data.users.filter(u => u.name !== currentUser).forEach(u => {
    const div = document.createElement("div");
    div.innerHTML = `<h3>${escapeHtml(u.name)}</h3>`;
    const ul = document.createElement("ul");
    u.list.forEach(itemObj => {
      const li = document.createElement("li");
      li.innerHTML = `<input type="checkbox" ${itemObj.purchased ? "checked disabled" : ""}>` + itemContent(itemObj);
      const cb = li.querySelector("input");
      cb.onclick = () => markPurchase(u.name, itemObj.name, cb);
      ul.appendChild(li);
    });
    div.appendChild(ul);
    others.appendChild(div);
  });
}

/* Confirmation popup pour réservation */
function markPurchase(user, item, checkbox) {
  const popup = document.getElementById("confirmPopup");
  document.getElementById("confirmMessage").textContent =
    `Attention, êtes-vous sûr de réserver le cadeau "${item}" pour ${user} ?`;
  popup.style.display = "flex";

  const yesBtn = document.getElementById("confirmYes");
  const noBtn = document.getElementById("confirmNo");
  const clean = () => { popup.style.display = "none"; yesBtn.onclick = null; noBtn.onclick = null; };

  yesBtn.onclick = async () => {
    const r = await api("/purchase", { user, item });
    if (r) { checkbox.checked = true; checkbox.disabled = true; } else { checkbox.checked = false; }
    clean();
  };
  noBtn.onclick = () => { checkbox.checked = false; clean(); };
}

/* Ajout d'un cadeau */
document.getElementById("addBtn").onclick = async () => {
  const val = document.getElementById("newItem").value.trim();
  const comment = document.getElementById("newComment").value.trim();
  if (!val) return;
  const r = await api("/addItem", { item: val, comment });
  if (!r) return;
  document.getElementById("newItem").value = "";
  document.getElementById("newComment").value = "";
  if (await loadData()) renderLists();
};

document.getElementById("logoutBtn").onclick = () => logout();

/* PIN */
document.getElementById("changePinBtn").onclick = () => { document.getElementById("pinPopup").style.display = "flex"; };
document.getElementById("cancelPin").onclick = () => { document.getElementById("pinPopup").style.display = "none"; };
document.getElementById("savePin").onclick = async () => {
  const newPin = document.getElementById("newPin").value.trim();
  const confirmPin = document.getElementById("confirmPin").value.trim();
  if (!/^\d{4}$/.test(newPin)) { alert("Le code PIN doit contenir exactement 4 chiffres."); return; }
  if (newPin !== confirmPin) { alert("Les codes PIN ne correspondent pas."); return; }
  const r = await api("/updatePin", { newPin });
  if (!r) return;
  alert("Votre code PIN a été mis à jour !");
  document.getElementById("newPin").value = "";
  document.getElementById("confirmPin").value = "";
  document.getElementById("pinPopup").style.display = "none";
};

/* Edit comment */
function editComment(item) {
  editingItem = item;
  const me = data.users.find(u => u.name === currentUser);
  const obj = me.list.find(x => x.name === item);
  document.getElementById("editCommentText").value = obj.comment || "";
  document.getElementById("editCommentPopup").style.display = "flex";
}

document.getElementById("cancelComment").onclick = () => { document.getElementById("editCommentPopup").style.display = "none"; };
document.getElementById("saveComment").onclick = async () => {
  const newComment = document.getElementById("editCommentText").value.trim();
  const r = await api("/updateComment", { item: editingItem, comment: newComment });
  document.getElementById("editCommentPopup").style.display = "none";
  if (r && await loadData()) renderLists();
};

/* Démarrage : liste des noms, puis reprise de session si possible */
(async () => {
  await loadUsers();
  if (token) await showMain();
})();
</script>

</body>
</html>
